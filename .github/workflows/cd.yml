name: CD # Continuous Deployment

permissions:
    contents: read
on:
    workflow_dispatch:
    push:
        tags:
            - "[v]?[0-9]+.[0-9]+.[0-9]+"

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true
jobs:
    publish:
        name: Publishing for ${{ matrix.job.os }}
        runs-on: ${{ matrix.job.os }}
        environment: CD
        strategy:
            matrix:
                job:
                    - os: macos-latest
                      os-name: macos
                      target: x86_64-apple-darwin
                      architecture: x86_64
                      binary-postfix: ""
                    - os: macos-latest
                      os-name: macos
                      target: aarch64-apple-darwin
                      architecture: arm64
                      binary-postfix: ""
                    - os: ubuntu-latest
                      os-name: linux
                      target: x86_64-unknown-linux-gnu
                      architecture: x86_64
                      binary-postfix: ""
                    - os: windows-latest
                      os-name: windows
                      target: x86_64-pc-windows-msvc
                      architecture: x86_64
                      binary-postfix: ".exe"

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2
              with:
                  submodules: true
                  persist-credentials: false
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # branch=master
              with:
                  toolchain: stable
                  targets: ${{ matrix.job.target }}
            - name: Build binary
              # zizmor: ignore[template-injection]
              run: cargo build --locked --release --target=${{ matrix.job.target}}
            - name: Packaging final binary
              shell: bash
              # zizmor: ignore[template-injection]
              run: |
                  cd target/${{ matrix.job.target }}/release

                  ########## create tar.gz ##########
                  RELEASE_NAME=nix-options-search-${GITHUB_REF/refs\/tags\//}-${{ matrix.job.os-name }}-${{ matrix.job.architecture }}
                  tar czvf $RELEASE_NAME.tar.gz $BINARY_NAME

                  ########## create sha256 ##########
                  if [[ ${{ runner.os }} == 'Windows' ]]; then
                    certutil -hashfile $RELEASE_NAME.tar.gz sha256 | grep -E [A-Fa-f0-9]{64} > $RELEASE_NAME.sha256
                  else
                    shasum -a 256 $RELEASE_NAME.tar.gz > $RELEASE_NAME.sha256
                  fi
            - name: Releasing assets
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # tag=v3.0.0
              with:
                  files: |
                      target/${{ matrix.job.target }}/release/nix-options-search-*.tar.gz
                      target/${{ matrix.job.target }}/release/nix-options-search-*.sha256
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-cargo:
        name: Publish to crates.io
        runs-on: ubuntu-latest
        environment: CD
        permissions:
            id-token: write # Required for OIDC token exchange
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2
              with:
                  submodules: true
                  persist-credentials: false
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # branch=master
              with:
                  toolchain: stable
            - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # tag=v1.0.5
              id: auth
            - run: cargo publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
